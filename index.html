<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umair AI Pro - Ultra Neural Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #bc13fe;
            --accent: #ff0055;
            --bg-dark: #020205;
            --glass: rgba(15, 15, 25, 0.95);
        }

        body {
            background-color: var(--bg-dark);
            background-image: var(https://4kwallpapers.com/images/walls/thumbs_3t/8286.jpg);
                radial-gradient(circle at 20% 30%, rgba(188, 19, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.1) 0%, transparent 40%),
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .main-interface {
            width: 950px;
            background: var(--glass);
            border: 1px solid rgba(0, 242, 255, 0.3);
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 1), 0 0 20px rgba(0, 242, 255, 0.2);
            position: relative;
            backdrop-filter: blur(20px);
        }

        /* Left Side: Command Center */
        .command-center {
            padding: 30px;
            border-right: 1px solid rgba(188, 19, 254, 0.3);
        }

        .header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            margin: 0;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        .os-tag {
            font-size: 10px;
            background: var(--primary);
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: var(--primary);
            padding: 20px;
            font-size: 18px;
            font-family: 'Rajdhani';
            resize: none;
            outline: none;
            box-sizing: border-box;
            border-left: 4px solid var(--primary);
        }

        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 60px;
            gap: 4px;
            margin: 20px 0;
        }

        .v-bar {
            width: 8px;
            height: 10px;
            background: var(--secondary);
            border-radius: 2px;
            transition: 0.1s;
        }

        .v-bar.active {
            animation: bounce 0.6s infinite alternate;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        @keyframes bounce {
            from { height: 10px; opacity: 0.3; }
            to { height: 50px; opacity: 1; }
        }

        /* Right Side: Voice Matrix */
        .voice-matrix {
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
        }

        .matrix-title {
            color: var(--secondary);
            font-family: 'Orbitron';
            font-size: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid var(--secondary);
            padding: 12px;
            font-family: 'Rajdhani';
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .param-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 8px;
            color: #888;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .btn-container {
            margin-top: 30px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-family: 'Orbitron';
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .btn-speak {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-speak:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        .btn-stop {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 12px;
            padding: 8px;
        }

        .status-panel {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
            line-height: 1.6;
        }

        .status-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .val { color: var(--primary); }

    </style>
</head>
<body>

<div class="main-interface">
    <!-- Left Section -->
    <div class="command-center">
        <div class="header">
            <h1>UMAIR AI <span style="font-weight: 300;">PRO</span></h1>
            <div class="os-tag">NEURAL CORE V5.0</div>
        </div>

        <textarea id="textInput" placeholder="> TYPE HUMAN SPEECH DATA..."></textarea>

        <div class="visualizer" id="visualizer">
            <!-- 15 bars for effect -->
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>

        <div class="btn-container">
            <button class="btn-speak" onclick="speak()">Initialize Transmission</button>
            <button class="btn-stop" onclick="stop()">Emergency Cut-off</button>
        </div>
    </div>

    <!-- Right Section -->
    <div class="voice-matrix">
        <div class="matrix-title">Neural Voice Selection</div>
        <select id="voiceSelect">
            <option>Detecting Neural Paths...</option>
        </select>

        <div class="param-box">
            <label>EMOTION FREQUENCY (PITCH)</label>
            <input type="range" id="pitch" min="0.1" max="2" step="0.1" value="1">
            <div style="display: flex; justify-content: space-between; font-size: 10px; margin-top: 5px;">
                <span>DEEP</span><span>HIGH</span>
            </div>
        </div>

        <div class="param-box">
            <label>NEURAL SPEED (RATE)</label>
            <input type="range" id="rate" min="0.1" max="2" step="0.1" value="1">
            <div style="display: flex; justify-content: space-between; font-size: 10px; margin-top: 5px;">
                <span>SLOW</span><span>FAST</span>
            </div>
        </div>

        <div class="status-panel">
            <div class="status-item"><span>ENGINE:</span> <span class="val">ACTIVE</span></div>
            <div class="status-item"><span>MODE:</span> <span class="val" id="modeVal">HUMAN ANALOG</span></div>
            <div class="status-item"><span>ENCRYPTION:</span> <span class="val">256-BIT NEURAL</span></div>
            <div style="margin-top: 15px; color: #444; font-family: monospace;">
                [SYSTEM LOG]<br>
                > All Human Voices Unlocked...<br>
                > Indian Male/Female Online...<br>
                > Ready for Input...
            </div>
        </div>
    </div>
</div>

<script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voiceSelect');
    const bars = document.querySelectorAll('.v-bar');
    const modeVal = document.getElementById('modeVal');

    let voices = [];

    function populateVoices() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';

        // Sort voices to put Human/Indian/Neural ones at top
        const sortedVoices = voices.sort((a, b) => {
            if (a.lang.includes('IN')) return -1;
            if (a.name.includes('Google') || a.name.includes('Natural')) return -1;
            return 1;
        });

        sortedVoices.forEach(voice => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} [${voice.lang.toUpperCase()}]`;
            option.value = voice.name;
            voiceSelect.appendChild(option);
        });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
    }
    populateVoices();

    function speak() {
        if (synth.speaking) { synth.cancel(); }

        const text = document.getElementById('textInput').value;
        if (text !== '') {
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoice = voiceSelect.value;

            voices.forEach(v => {
                if(v.name === selectedVoice) utterance.voice = v;
            });

            utterance.pitch = document.getElementById('pitch').value;
            utterance.rate = document.getElementById('rate').value;

            utterance.onstart = () => {
                bars.forEach((bar, index) => {
                    bar.style.animationDelay = `${index * 0.05}s`;
                    bar.classList.add('active');
                });
                modeVal.innerText = "TRANSMITTING...";
                modeVal.style.color = "var(--primary)";
            };

            utterance.onend = () => {
                bars.forEach(bar => bar.classList.remove('active'));
                modeVal.innerText = "HUMAN ANALOG";
                modeVal.style.color = "var(--primary)";
            };

            synth.speak(utterance);
        }
    }

    function stop() {
        synth.cancel();
        bars.forEach(bar => bar.classList.remove('active'));
        modeVal.innerText = "TERMINATED";
        modeVal.style.color = "var(--accent)";
    }
</script>

</body>
</html>
